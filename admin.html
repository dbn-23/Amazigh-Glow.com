<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazigh Glow - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --clr-charcoal: #2b2b2b;
            --clr-terracotta: #a5442a;
            --clr-cream: #FCF8F2;
            --clr-white: #ffffff;
            --clr-gray: #f5f5f5;
            --clr-dark-gray: #666;
            --font-main: 'Inter', sans-serif;
        }

        body {
            font-family: var(--font-main);
            background-color: var(--clr-cream);
            color: var(--clr-charcoal);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--clr-charcoal);
            color: var(--clr-white);
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
        }

        .card {
            background: var(--clr-white);
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            padding: 2rem;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 1rem;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--clr-gray);
            font-weight: 600;
            color: var(--clr-charcoal);
            text-transform: uppercase;
            font-size: 0.85rem;
        }

        tr:hover {
            background-color: #fcfcfc;
        }

        .product-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .product-list li {
            padding: 4px 0;
            font-size: 0.9rem;
            border-bottom: 1px dashed #eee;
        }
        .product-list li:last-child {
            border-bottom: none;
        }

        .price {
            font-weight: 600;
            color: var(--clr-terracotta);
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--clr-dark-gray);
        }

        .refresh-btn {
            background: var(--clr-terracotta);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-main);
            font-weight: 500;
            transition: background 0.3s;
        }

        .refresh-btn:hover {
            background: #8b3720;
        }
    </style>
</head>
<body>

    <header>
        <h1><i class="fas fa-seedling"></i> Amazigh Glow Admin</h1>
        <button class="refresh-btn" onclick="fetchOrders()"><i class="fas fa-sync-alt"></i> Refresh Orders</button>
    </header>

    <div class="container">
        <div class="card">
            <h2 style="margin-top: 0; margin-bottom: 1.5rem;">Customer Orders</h2>
            <table>
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Customer</th>
                        <th>Contact</th>
                        <th>Address</th>
                        <th>Products</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="orders-table-body">
                    <tr><td colspan="7" class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading orders...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        function fetchOrders() {
            const tbody = document.getElementById('orders-table-body');
            tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><i class="fas fa-spinner fa-spin"></i> Loading orders...</td></tr>';
            
            fetch('http://localhost:8000/api/orders')
                .then(res => res.json())
                .then(orders => {
                    if (orders.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="empty-state">No orders have been submitted yet.</td></tr>';
                        return;
                    }
                    
                    tbody.innerHTML = '';
                    orders.forEach(order => {
                        const tr = document.createElement('tr');
                        
                        let productHtml = '<ul class="product-list">';
                        order.products.forEach(p => {
                            productHtml += `<li><b>${p.quantity}x</b> ${p.title}</li>`;
                        });
                        productHtml += '</ul>';

                        tr.innerHTML = `
                            <td>#${String(order.id).padStart(4, '0')}</td>
                            <td style="white-space:nowrap;">${order.order_date}</td>
                            <td><b>${order.customer_name}</b></td>
                            <td style="white-space:nowrap;"><i class="fas fa-phone fa-sm" style="color:#888;"></i> ${order.phone_number}</td>
                            <td>${order.delivery_address}</td>
                            <td>${productHtml}</td>
                            <td class="price">${order.total_price.toFixed(2)} MAD</td>
                        `;
                        tbody.appendChild(tr);
                    });
                })
                .catch(err => {
                    console.error(err);
                    tbody.innerHTML = '<tr><td colspan="7" class="empty-state" style="color:red;">Error loading orders. Is the server running?</td></tr>';
                });
        }

        // Fetch orders immediately on load
        document.addEventListener('DOMContentLoaded', fetchOrders);
    </script>
</body>
</html>
